[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "faultloc-benchmark"
version = "0.1.0"
description = "Mutation-generated fault-localization benchmark for coding agents"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.128.8",
  "httpx==0.28.1",
  "pytest==8.4.2",
  "rank-bm25==0.2.2",
  "tiktoken==0.14.0",
  "uvicorn==0.39.0",
]

[project.optional-dependencies]
dense = ["fastembed==0.7.4"]

[tool.setuptools.packages.find]
include = ["faultloc*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
pythonpath = [".", "target"]
testpaths = ["tests", "target/toolz/tests", "target/toolz/sandbox/tests"]
